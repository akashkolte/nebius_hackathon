# Public demo: Dispatch behind Caddy, which gets an HTTPS certificate for DISPATCH_DOMAIN automatically.
services:
  dispatch:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - dispatch-data:/data
    # The agent runs judges' commands here, so keep the container small and unprivileged.
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    command: caddy reverse-proxy --from ${DISPATCH_DOMAIN:?Set DISPATCH_DOMAIN in .env} --to dispatch:4378
    volumes:
      - caddy-data:/data
    depends_on: [dispatch]

volumes:
  dispatch-data:
  caddy-data:
